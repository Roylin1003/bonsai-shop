<script>
'use strict';
//<SIM>
const START_DOY=74;
const POT=[{n:'小盆',v:.6},{n:'中盆',v:1},{n:'大盆',v:1.7}];
const SPOT={win:{n:'窗邊',dir:-.9,accl:.55},room:{n:'室內',dir:-.5,accl:.14},bon:{n:'盆景台',dir:-.4,accl:.35},balc:{n:'陽台',dir:0,accl:.8}};
// 參數皆為「遊戲尺度的假設值」，已在設計指南列出真實依據與待校正處
const SP={
 pothos:{name:'黃金葛',kind:'foliage',rb:5,Ik:.22,Ihigh:.95,Pmax:.0125,r0:.0017,rn:.25,Tmin:10,Tlo:21,Thi:30,Tmax:38,Tcold:12,wp:.15,fc:.65,drain:.22,wetLim:.55,use:1,LAref:8,rootMax:[2.4,5.5,11],nodeCost:.16,res:.3,cap:2.2,rs:.38},
 echeveria:{name:'石蓮花',kind:'succ',rb:5,Ik:.5,Ihigh:9,Pmax:.0135,r0:.0013,rn:.1,Tmin:3,Tlo:15,Thi:25,Tmax:35,Tcold:2,wp:.1,fc:.42,drain:.45,wetLim:.3,use:.3,LAref:6,rootMax:[1.6,3.6,7.5],nodeCost:.26,res:.3,cap:2,rs:.35},
 ficus:{name:'小葉榕',kind:'bonsai',rb:1.6,Ik:.5,Ihigh:1.1,Pmax:.0125,r0:.0015,rn:.12,Tmin:9,Tlo:21,Thi:31,Tmax:38,Tcold:7,wp:.15,fc:.6,drain:.3,wetLim:.5,use:.85,LAref:14,rootMax:[3.4,3.4,3.4],nodeCost:.16,res:.3,cap:3,rs:.3}
};
const clamp=(x,a,b)=>x<a?a:x>b?b:x;
const smooth=x=>{x=clamp(x,0,1);return x*x*(3-2*x)};
const rnd=(a,b)=>a+Math.random()*(b-a);
const pct=v=>Math.round(v*100);
function newWeather(prev,doy){
 const sea=Math.sin(2*Math.PI*(doy-110)/365);
 const rain=Math.random()<.24+.06*sea;
 const r0=Math.floor(rnd(5,17));
 return {rain,r0,r1:r0+Math.floor(rnd(2,7)),cloud:rain?.3:rnd(.72,1),dT:clamp(.7*(prev?prev.dT:0)+rnd(-2,2)-(rain?.8:0),-6,5)};
}
function envFor(W,spot){
 const doy=(START_DOY+W.day)%365,hour=W.h,wx=W.wx;
 const Tm=23+7*Math.sin(2*Math.PI*(doy-110)/365)+wx.dT;
 const Tout=Tm+4*Math.sin(2*Math.PI*(hour-9)/24);
 const sun0=Math.max(0,Math.sin(Math.PI*(hour-6)/12));
 const raining=wx.rain&&hour>=wx.r0&&hour<wx.r1;
 const sun=sun0*(raining?.25:wx.cloud);
 const Tin=clamp(.5*Tout+11,17,29);
 let par,T,rain=false;
 if(spot==='win'){par=.85*sun;T=Tin+3*sun}
 else if(spot==='room'){par=.22*sun+((hour>=18&&hour<23)?.03:0);T=Tin}
 else if(spot==='bon'){par=.95*sun;T=Tin+2*sun}
 else{par=1.25*sun;T=Tout+(raining?0:3*sun);rain=raining}
 return {par,T,rain,Tout,raining,sun};
}
function tempF(S,T){
 if(T<=S.Tmin||T>=S.Tmax)return 0;
 if(T<S.Tlo)return(T-S.Tmin)/(S.Tlo-S.Tmin);
 if(T<=S.Thi)return 1;
 return(S.Tmax-T)/(S.Tmax-S.Thi);
}
function plog(W,p,msg){p.log.push([W.day*24+W.h,msg]);if(p.log.length>80)p.log.shift();}
function flag(W,p,k,on,off,msg){if(!p.f[k]&&on){p.f[k]=1;plog(W,p,msg)}else if(p.f[k]&&off)p.f[k]=0}
function mkNode(par,a,L,T,lf,th){return{par,a,L,T,lf,th,w:null,sc:0,y:0,dead:0}}
function newPlant(W,sp,spot,o){
 o=o||{};
 const p={id:W.nextId++,sp,spot,pot:o.pot!=null?o.pot:1,w:o.w!=null?o.w:.5,N:.5,root:o.root||1.2,C:.5,shootC:0,rot:0,burn:0,cold:0,scar:0,hot:0,turgor:1,plump:1,etio:0,lean:0,accl:SPOT[spot].accl,dli:0,starve:0,shock:0,goodDays:0,dead:false,log:[],hist:[],f:{},LA:0,chlor:1,fill:0,hp:1,yf:0,net:0,stem:0,wood:0};
 if(sp==='pothos'){
  const mk=n=>({s:.85,y:0,dead:0,bare:false});
  p.stems=[{par:null,side:-1,nodes:[mk(),mk(),mk(),mk()]},{par:null,side:1,nodes:[mk(),mk(),mk()]}];
 }else if(sp==='echeveria'){
  p.leaves=[];for(let i=0;i<9;i++)p.leaves.push({s:.8,y:0,dead:0});
  p.stem=.3;
 }else{
  p.root=o.root||1.8;
  p.tree=[mkNode(-1,0,26,26,0,3.4),mkNode(0,-.14,15,20,.8,2.6),mkNode(1,.22,11,18,.8,2),mkNode(0,.95,9,12,.8,1.8),mkNode(2,-.3,7,14,.7,1.5),mkNode(3,.5,6,10,.7,1.4)];
 }
 p.LA=calcLA(p);
 plog(W,p,'入手：'+SP[sp].name+'，放在'+SPOT[spot].n);
 return p;
}
function calcLA(p){
 let a=0;
 if(p.sp==='pothos'){for(const st of p.stems)for(const n of st.nodes)if(!n.bare)a+=n.s*(1-n.y)}
 else if(p.sp==='echeveria'){for(const l of p.leaves)a+=l.s*(1-l.y)*(.5+.5*p.plump)*.9}
 else{for(const n of p.tree)if(n.par>=0)a+=n.lf*(1-n.y)*2.2}
 return a;
}
function leafList(p){
 const out=[];
 if(p.sp==='pothos'){for(const st of p.stems)for(const n of st.nodes)if(!n.bare)out.push(n)}
 else if(p.sp==='echeveria'){for(const l of p.leaves)out.push(l)}
 else{for(const n of p.tree)if(n.par>=0&&n.lf>.05)out.push(n)}
 return out;
}
function layoutTree(p){
 const T=p.tree,n=T.length,ang=new Float32Array(n),x0=new Float32Array(n),y0=new Float32Array(n),x1=new Float32Array(n),y1=new Float32Array(n);
 for(let i=0;i<n;i++){
  const q=T[i],pa=q.par;
  ang[i]=(pa<0?-Math.PI/2:ang[pa])+q.a;
  x0[i]=pa<0?0:x1[pa];y0[i]=pa<0?0:y1[pa];
  x1[i]=x0[i]+Math.cos(ang[i])*q.L;y1[i]=y0[i]+Math.sin(ang[i])*q.L;
 }
 return{ang,x0,y0,x1,y1};
}
function treeKids(T){const k=new Array(T.length).fill(0);for(const n of T)if(n.par>=0)k[n.par]++;return k}
function cutTree(W,p,c){
 const T=p.tree;if(c<=0||c>=T.length)return false;
 const rm=new Set([c]);for(let i=c+1;i<T.length;i++)if(rm.has(T[i].par))rm.add(i);
 const q=T[c].par,map=[],out=[];
 T.forEach((n,i)=>{if(!rm.has(i)){map[i]=out.length;out.push(n)}});
 out.forEach(n=>{if(n.par>=0)n.par=map[n.par]});
 const before=p.LA;p.tree=out;const nq=map[q];
 const kids=treeKids(out);
 if(kids[nq]<3){
  const s=Math.random()<.5?1:-1;
  out.push(mkNode(nq,s*rnd(.55,.9),1.5,rnd(9,13),0,1.2));
  out.push(mkNode(nq,-s*rnd(.55,.9),1.5,rnd(9,13),0,1.2));
 }
 p.LA=calcLA(p);
 if(before>0&&(before-p.LA)/before>.4)p.shock=Math.max(p.shock,48);
 plog(W,p,'修剪：剪掉 '+rm.size+' 段枝；剪口下方的芽被釋放（分枝變多）');
 return true;
}
function growTree(p){
 const T=p.tree;if(T.length>=170)return;
 const g=T.filter(n=>n.L<n.T-.01);
 if(g.length){const n=g[Math.floor(Math.random()*g.length)];n.L=Math.min(n.T,n.L+n.T*.38);return}
 const lay=layoutTree(p),kids=treeKids(T);
 const tips=[];for(let i=0;i<T.length;i++)if(!kids[i])tips.push(i);
 if(!tips.length)return;
 const ws=tips.map(i=>Math.pow(1+Math.max(0,-lay.y1[i])/60,3));
 let r=Math.random()*ws.reduce((a,b)=>a+b,0),pick=tips[0];
 for(let k=0;k<tips.length;k++){r-=ws[k];if(r<=0){pick=tips[k];break}}
 const up=-Math.PI/2-lay.ang[pick];
 const bias=SPOT[p.spot].dir*.18*(.3+p.etio);
 const a=clamp(up*.3+rnd(-.35,.35)+bias,-1,1);
 T.push(mkNode(pick,a,2,rnd(12,20)*(1+.9*p.etio),0,1.4));
 if(Math.random()<.22)T.push(mkNode(pick,(Math.random()<.5?-1:1)*rnd(.6,1),2,rnd(9,14)*(1+.7*p.etio),0,1.2));
}
function growPothos(p){
 let tot=0;for(const st of p.stems)tot+=st.nodes.length;
 if(tot>=100)return;
 const cand=p.stems.filter(s=>s.nodes.length<18);
 if(!cand.length||(p.stems.length<5&&Math.random()<.04)){
  p.stems.push({par:null,side:Math.random()<.5?-1:1,nodes:[{s:.1,y:0,dead:0,bare:false}]});return;
 }
 const ws=cand.map(s=>s.nodes.length+2);
 let r=Math.random()*ws.reduce((a,b)=>a+b,0),st=cand[0];
 for(let k=0;k<cand.length;k++){r-=ws[k];if(r<=0){st=cand[k];break}}
 st.nodes.push({s:.1,y:0,dead:0,bare:false});
}
function growSucc(p){
 p.leaves.push({s:.1,y:0,dead:0});
 p.stem+=.12+3.4*p.etio*p.etio;
 if(p.leaves.length>22)p.leaves[0].y=1;
}
function shedLeaf(W,p){
 if(p.sp==='pothos'){outer:for(const st of p.stems)for(const n of st.nodes)if(!n.bare){n.bare=true;break outer}}
 else if(p.sp==='echeveria'){if(p.leaves.length>3)p.leaves.shift()}
 else{const c=p.tree.filter(n=>n.par>=0&&n.lf>.4);if(c.length){const n=c[Math.floor(Math.random()*c.length)];n.lf=.02;n.y=0}}
 plog(W,p,'碳不足：葉片脫落（光太弱、根壞或剪太重）');
}
function stepPlant(W,p){
 if(p.dead)return;
 const S=SP[p.sp],pot=POT[p.pot],e=envFor(W,p.spot);
 p.LA=calcLA(p);
 const fill=clamp(p.root/S.rootMax[p.pot],0,1.3);p.fill=fill;
 if(e.rain)p.w=Math.min(1,p.w+.03);
 const lfrac=Math.min(1,p.LA/S.LAref);
 const dem=(e.par*.0042+.0012+.0004*Math.max(0,e.T-12))*S.use*(.35+.65*lfrac)*Math.pow(pot.v,-.5)*(e.raining?.5:1)*.7;
 p.w=Math.max(S.wp*.55,p.w-dem);
 if(p.w>S.fc){const ex=(p.w-S.fc)*S.drain;p.w-=ex;p.N=Math.max(0,p.N-ex*.25)}
 const a=clamp((p.w-S.wp)/(S.fc-S.wp),0,1.3);
 let waterF;
 if(S.kind==='succ'){
  if(a>.25)p.plump=Math.min(1,p.plump+.004);else p.plump=Math.max(0,p.plump-.0018*(1+.05*Math.max(0,e.T-20)));
  waterF=.2+.8*smooth(p.plump/.5);p.turgor=p.plump;
 }else{waterF=smooth(a/.35);p.turgor+=(waterF-p.turgor)*(waterF<p.turgor?.12:.06)}
 // 缺氧爛根
 const wet=clamp((p.w-S.wetLim)/(1-S.wetLim),0,1);
 if(wet>0)p.rot=Math.min(1,p.rot+.006*wet);else p.rot=Math.max(0,p.rot-.0003);
 p.root=Math.max(0,p.root-p.root*(p.rot*.002+p.burn*.002));
 // 肥傷
 if(p.N>1)p.burn=Math.min(1,p.burn+.008*(p.N-1));else if(p.N<.9)p.burn=Math.max(0,p.burn-.0006);
 // 光適應與曬傷
 if(e.par>.02){if(e.par>p.accl)p.accl+=(e.par-p.accl)*.004;else p.accl=Math.max(.12,p.accl-.0006)}
 const over=e.par-p.accl-.38;
 if(over>0&&e.T>27){p.scar=Math.min(1,p.scar+over*.09*(e.T-25)/8);p.hot=10}else{p.scar=Math.max(0,p.scar-.0004);p.hot=Math.max(0,p.hot-1)}
 // 低溫

function dailyUpdate(W){

   const T=p.tree,n=T.length,sub=new Float32Array(n);let wood=0;
   for(let i=n-1;i>=0;i--){sub[i]+=T[i].par>=0?T[i].lf:0;if(T[i].par>=0)sub[T[i].par]+=sub[i];wood+=T[i].th*T[i].L/150}
   p.wood=wood;
   for(let i=0;i<n;i++){const tg=1.2+1.15*Math.sqrt(sub[i]);if(tg>T[i].th)T[i].th+=(tg-T[i].th)*.06}
  }

 }
}

}

function bonsaiScore(p){

 for(let i=0;i<T.length;i++)H=Math.max(H,-lay.y1[i]);
 for(let i=0;i<T.length;i++){
  if(T[i].par>=0&&T[i].lf>.2){if(lay.x1[i]>0)R+=T[i].lf;else L+=T[i].lf}
  if(!kids[i]){
   tips++;thTip+=T[i].th;tT+=T[i].T;
   const y=-lay.y1[i],hw=.46*H*(1-(y/H)*.9)+10;
   if(y>=.15*H&&Math.abs(lay.x1[i])<=hw)inside++;
  }
 }
 const fit=tips?inside/tips:0,dens=clamp(tips/12,0,1),bal=1-Math.abs(L-R)/(L+R+.001);
 const fine=clamp(1-((tips?tT/tips:20)-9)/12,0,1),taper=clamp((T[0].th/(tips?thTip/tips:1)-1.5)/2,0,1);

 const total=100*(.3*fit+.25*dens+.2*bal+.15*fine+.1*taper)*(1-.35*clamp(sc/4,0,1));

}

function mood(p){
 if(p.dead)return'dead';
 if(p.cold>.12)return'cold';
 if(p.hot>0&&p.scar>.12)return'hot';
 if(p.rot>.18||p.w>.93||p.burn>.15)return'sick';

function drawFace(c,x,y,s,md,asleep){

 c.fillStyle=ck;c.globalAlpha=.55;c.beginPath();c.ellipse(-ex-6*s,8*s,5.5*s,3.4*s,0,0,6.29);c.ellipse(ex+6*s,8*s,5.5*s,3.4*s,0,0,6.29);c.fill();c.globalAlpha=1;

 else{
  if(md==='hot'){for(const d of[-1,1]){c.beginPath();c.moveTo(d*ex-d*r,ey-r);c.lineTo(d*ex+d*r,ey);c.lineTo(d*ex-d*r,ey+r);c.stroke()}}
  else if(md==='sick'){for(const sx of[-ex,ex]){c.beginPath();c.arc(sx,ey,r*1.1,0,6.29);c.stroke();c.beginPath();c.arc(sx+r*.3,ey,r*.4,0,6.29);c.fill()}}

   const j=i+1,h=spacing*j*(1+1.8*p.etio)-cc*j*j,xo=st.side*S*(3.2*j+.12*j*j);

  c.fillStyle='rgba(232,212,106,.5)';for(let k=0;k<2;k++){c.beginPath();c.ellipse(sz*(.35+.25*hash(si*50+i,k)),(hash(i,k+4)-.5)*sz*.4,sz*.1,sz*.07,hash(i,k),0,6.29);c.fill()}
  if(p.scar>.12&&hash(si*50+i,11)<p.scar*1.4){c.fillStyle='rgba(150,100,50,.75)';c.beginPath();c.ellipse(sz*.5,sz*.1,sz*.17,sz*.12,.4,0,6.29);c.fill()}
  c.strokeStyle='rgba(30,80,40,.35)';c.lineWidth=1;c.beginPath();c.moveTo(0,0);c.lineTo(sz*.9,0);c.stroke();
  c.restore();

function petal(c,bx,by,tx,ty,w){const dx=tx-bx,dy=ty-by,L=Math.hypot(dx,dy)||1,nx=-dy/L*w,ny=dx/L*w;c.beginPath();c.moveTo(bx,by);c.bezierCurveTo(bx+dx*.25+nx,by+dy*.25+ny,bx+dx*.75+nx*.9,by+dy*.75+ny*.9,tx,ty);c.bezierCurveTo(bx+dx*.75-nx*.9,by+dy*.75-ny*.9,bx+dx*.25-nx,by+dy*.25-ny,bx,by);c.closePath()}
function drawSucc(c,p,X,Y,S,pt){

 if(stemH>2){c.strokeStyle=C.stem;c.lineWidth=7*S;c.lineCap='round';c.beginPath();const b=pt(0,0);c.moveTo(b[0],b[1]);c.lineTo(cx,cy);c.stroke()}

function cutTarget(h){

 else if(h.kind==='pstem'){
  const st=p.stems[h.si];
  if(st&&h.ni<st.nodes.length-1){
   const before=p.LA;st.nodes.length=h.ni+1;
   const rm=new Set();
   p.stems.forEach((s,si)=>{if(s.par&&(rm.has(s.par.si)||(s.par.si===h.si&&s.par.ni>h.ni)))rm.add(si)});
   const map=[],out=[];p.stems.forEach((s,i)=>{if(!rm.has(i)){map[i]=out.length;out.push(s)}});out.forEach(s=>{if(s.par)s.par={si:map[s.par.si],ni:s.par.ni}});p.stems=out;

 }

 $('wxTxt').textContent=(e.raining?'🌧':wx.rain?'🌥':wx.cloud>.9?'☀️':'⛅')+' '+Math.round(e.Tout)+'°C';
}

// ---------- 主迴圈 ----------
let last=performance.now(),acc=0,saveT=0,panelT=0;
function frame(t){
 const dt=Math.min((t-last)/1000,.1);last=t;tClock+=dt;
 if(started&&!document.hidden&&ui.speed>0){
  acc+=dt*ui.speed;let k=0;
  while(acc>=1&&k<64){tickHour(W);acc-=1;k++}
  if(k>=64)acc=0;accFrac=acc;drainOut();
 }
 if(ptr.pour&&ptr.down){const sl=slotAt(ptr.wx,ptr.wy);if(sl&&sl.p&&!sl.p.dead)pourOn(sl.p,dt);else{ptr.pouring=false;if(ptr.pourP)endPourLogOnly()}}
 const tg=camTarget(),k2=Math.min(1,dt*7);cam.cx+=(tg.cx-cam.cx)*k2;cam.cy+=(tg.cy-cam.cy)*k2;cam.z+=(tg.z-cam.z)*k2;
 drawWorld(dt);
 hud();
 panelT+=dt;if(panelT>.6){panelT=0;if(!ptr.down)renderSheet()}
 saveT+=dt;if(saveT>6&&started){saveT=0;save()}
 requestAnimationFrame(frame);
}
document.addEventListener('visibilitychange',()=>{last=performance.now();if(document.hidden)save()});

// ---------- 啟動 ----------
(function init(){
 const saved=load();
 if(saved){$('newBtn').style.display='';W=saved}else W=newWorld();
 if(/#bonsai/.test(location.hash||'')&&!W.unlocked)unlockBonsai(W);
 if(W.unlocked)$('wireBtn').style.display='';
 const start=()=>{started=true;$('title').style.display='none';SND.init();W.out=[]};
 $('goBtn').addEventListener('click',start);
 $('newBtn').addEventListener('click',()=>{W=newWorld();$('wireBtn').style.display='none';start()});
 $('bonBtn').addEventListener('click',()=>{W=newWorld();unlockBonsai(W);$('wireBtn').style.display='';start()});
 requestAnimationFrame(frame);
})();
</script>
